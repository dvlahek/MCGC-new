name: Research v0.7 confirmation

on:
  push:
    branches:
      - feature/v0.7-calibrated-reliability
  workflow_dispatch:

jobs:
  calibrated-reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Frozen v0.7 benchmark
        run: python examples/benchmark_calibrated_reliability_v07.py
