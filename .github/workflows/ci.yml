name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Smoke benchmark
        if: matrix.python-version == '3.11'
        run: python examples/benchmark_synthetic.py
      - name: Ablation benchmark v0.2
        if: matrix.python-version == '3.11'
        run: python examples/benchmark_ablation_v02.py
      - name: Multi-seed confirmation v0.4
        if: matrix.python-version == '3.11'
        run: python examples/benchmark_multiseed_v04.py
      - name: Selective-walker confirmation v0.5
        if: matrix.python-version == '3.11'
        run: python examples/benchmark_selective_v05.py
