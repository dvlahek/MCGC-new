name: v2.6 corrected predictive baselines

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v2.6-corrected-predictive-baselines

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run v2.6 corrected predictive baseline audit
        run: |
          mkdir -p results/v26
          python -u examples/benchmark_corrected_predictive_v26.py \
            --output results/v26/v26_corrected_predictive_baselines.json \
            2>&1 | tee results/v26/v26_corrected_predictive_baselines.log
      - uses: actions/upload-artifact@v4
        with:
          name: v26-corrected-predictive-baselines
          path: |
            results/v26/v26_corrected_predictive_baselines.json
            results/v26/v26_corrected_predictive_baselines.log
