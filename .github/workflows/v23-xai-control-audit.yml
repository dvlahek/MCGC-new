name: v2.3 XAI control audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v2.3-xai-control-audit
    paths:
      - "examples/benchmark_xai_faithfulness_v09bis.py"
      - "examples/benchmark_xai_stability_v15bis.py"
      - "docs/V23_XAI_CONTROL_AUDIT_PROTOCOL.md"
      - ".github/workflows/v23-xai-control-audit.yml"

jobs:
  faithfulness:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run v0.9-bis faithfulness controls
        run: |
          mkdir -p results/v23
          python -u examples/benchmark_xai_faithfulness_v09bis.py \
            --output results/v23/v09bis_xai_faithfulness.json \
            2>&1 | tee results/v23/v09bis_xai_faithfulness.log
      - uses: actions/upload-artifact@v4
        with:
          name: v23-faithfulness
          path: |
            results/v23/v09bis_xai_faithfulness.json
            results/v23/v09bis_xai_faithfulness.log

  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run v1.5-bis stability controls
        run: |
          mkdir -p results/v23
          python -u examples/benchmark_xai_stability_v15bis.py \
            --output results/v23/v15bis_xai_stability.json \
            2>&1 | tee results/v23/v15bis_xai_stability.log
      - uses: actions/upload-artifact@v4
        with:
          name: v23-stability
          path: |
            results/v23/v15bis_xai_stability.json
            results/v23/v15bis_xai_stability.log
