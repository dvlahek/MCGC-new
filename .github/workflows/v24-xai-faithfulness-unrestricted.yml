name: v2.4 XAI unrestricted faithfulness

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v2.4-xai-faithfulness-unrestricted
    paths:
      - "examples/benchmark_xai_faithfulness_v09ter.py"
      - "docs/V24_XAI_FAITHFULNESS_UNRESTRICTED_PROTOCOL.md"
      - ".github/workflows/v24-xai-faithfulness-unrestricted.yml"

jobs:
  faithfulness-unrestricted:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run v0.9-ter unrestricted comparator
        run: |
          mkdir -p results/v24
          python -u examples/benchmark_xai_faithfulness_v09ter.py \
            --output results/v24/v09ter_xai_faithfulness_unrestricted.json \
            2>&1 | tee results/v24/v09ter_xai_faithfulness_unrestricted.log
      - uses: actions/upload-artifact@v4
        with:
          name: v24-faithfulness-unrestricted
          path: |
            results/v24/v09ter_xai_faithfulness_unrestricted.json
            results/v24/v09ter_xai_faithfulness_unrestricted.log
